<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Administrador | Ruleta Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos exclusivos del panel de administrador */
    .admin-badge-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }

    .badge-admin-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.45);
      color: var(--magenta-primary);
      font-size: clamp(0.7rem, 2.4vw, 0.8rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.25);
    }

    .badge-admin-status .dot {
      width: 8px;
      height: 8px;
      background: var(--magenta-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--magenta-primary);
      animation: pulseDot 1.5s infinite;
    }

    .steps-progress {
      display: flex;
      gap: 0.35rem;
      width: min(90vw, 420px);
      justify-content: space-between;
    }

    .step-pill {
      flex: 1;
      padding: 0.35rem 0.2rem;
      font-size: clamp(0.65rem, 2.2vw, 0.72rem);
      font-weight: 700;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      text-align: center;
      transition: all 0.3s;
    }

    .step-pill.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--cyan-primary);
      color: var(--cyan-primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .step-pill.step-winner.active {
      background: rgba(0, 242, 254, 0.25);
      border-color: var(--cyan-primary);
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }

    /* La ruleta en modo admin es táctil y tiene cursor pointer */
    .admin-wheel-clickable {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .admin-wheel-clickable:active:not(.spinning) {
      transform: scale(0.985);
    }

    /* Indicador flotante sutil que invita a tocar */
    .tap-hint-pill {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--cyan-primary);
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.2);
      padding: 0.2rem 0.8rem;
      border-radius: 100px;
      margin-top: 0.3rem;
      animation: pulseSubtle 2s infinite alternate;
    }

    @keyframes pulseSubtle {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    .admin-bottom-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .btn-reset-mini {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      font-size: 0.72rem;
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn-reset-mini:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
  </style>
</head>
<body class="spectator-view admin-mode">
  <!-- Efectos de iluminación ambiental neón -->
  <div class="bg-glow bg-glow-cyan"></div>
  <div class="bg-glow bg-glow-magenta"></div>
  <div class="grid-overlay"></div>

  <div class="app-container">
    <!-- Encabezado de Administrador -->
    <header class="spectator-header">
      <div class="admin-badge-bar">
        <div class="badge-admin-status">
          <span class="dot"></span> MODO CONTROL &bull; TOCA LA RULETA PARA GIRAR
        </div>
        <div class="steps-progress">
          <div class="step-pill active" id="step1">1. Prueba</div>
          <div class="step-pill" id="step2">2. Prueba</div>
          <div class="step-pill" id="step3">3. Prueba</div>
          <div class="step-pill step-winner" id="step4">4. Gana 51</div>
        </div>
      </div>
    </header>

    <!-- Ruleta Gigante Interactiva Exclusiva de Administrador -->
    <main class="roulette-section">
      <!-- Indicador HUD en tiempo real del número bajo la aguja -->
      <div class="hud-tracker" id="hudTracker">
        <span class="hud-label">APUNTANDO A:</span>
        <span class="hud-value" id="hudValue">00</span>
      </div>

      <!-- Contenedor de la Ruleta (Toca aquí para girar) -->
      <div class="wheel-outer-wrapper admin-wheel-clickable" id="adminWheelTouchable" title="Toca para girar la ruleta para todos">
        <!-- Aguja física animada -->
        <div class="pointer-assembly" id="pointerAssembly">
          <div class="pointer-glow"></div>
          <div class="pointer-pin"></div>
          <div class="pointer-needle" id="pointerNeedle"></div>
        </div>

        <!-- Canvas de la Ruleta -->
        <div class="wheel-canvas-container" id="wheelContainer">
          <canvas id="rouletteCanvas" width="1000" height="1000"></canvas>
          
          <!-- Núcleo central decorativo -->
          <div class="wheel-center-hub">
            <div class="hub-ring"></div>
            <div class="hub-core">
              <svg class="hub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="tap-hint-pill" id="tapHint">👆 TOCA LA RULETA PARA GIRAR</div>

      <!-- Texto de Estado -->
      <div class="spectator-status-container" id="spectatorStatusContainer">
        <div class="status-pulse-dot" id="statusDot"></div>
        <div class="spectator-status-text" id="spectatorStatus">LISTO: VUELTA 1 DE PRUEBA</div>
      </div>

      <div class="admin-bottom-actions">
        <button id="resetCycleBtn" class="btn-reset-mini" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          Reiniciar a Vuelta 1
        </button>
      </div>
    </main>
  </div>

  <script>
    /**
     * SCRIPT DEL PANEL DE ADMINISTRADOR INTERACTIVO
     * Tocar la ruleta envía la orden al servidor y gira en todos los móviles.
     */
    const TOTAL_NUMBERS = 151;
    const SPIN_DURATION_MS = 3600;
    const FULL_ROTATIONS = 7;

    const items = Array.from({ length: TOTAL_NUMBERS }, (_, i) => {
      if (i === 0) return '00';
      return i < 10 ? '0' + i : String(i);
    });

    const sliceAngle = (2 * Math.PI) / TOTAL_NUMBERS;

    let currentRotation = 0;
    let isSpinning = false;
    let lastTickIndex = -1;
    let currentTurn = 0;

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    const wheelContainer = document.getElementById('wheelContainer');
    const pointerNeedle = document.getElementById('pointerNeedle');
    const hudValue = document.getElementById('hudValue');
    const spectatorStatus = document.getElementById('spectatorStatus');
    const spectatorStatusContainer = document.getElementById('spectatorStatusContainer');
    const adminWheelTouchable = document.getElementById('adminWheelTouchable');
    const tapHint = document.getElementById('tapHint');
    const resetCycleBtn = document.getElementById('resetCycleBtn');

    // Web Audio
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTick() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.025);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      } catch (e) {}
    }

    function playChime() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        [440, 659.25].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.18, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.65);
        });
      } catch (e) {}
    }

    // Pre-render rueda
    let offscreenCanvas = null;
    const VIRTUAL_SIZE = 1000;

    function renderWheel() {
      offscreenCanvas = document.createElement('canvas');
      offscreenCanvas.width = VIRTUAL_SIZE;
      offscreenCanvas.height = VIRTUAL_SIZE;
      const offCtx = offscreenCanvas.getContext('2d');
      const cx = VIRTUAL_SIZE / 2;
      const cy = VIRTUAL_SIZE / 2;
      const r = (VIRTUAL_SIZE / 2) - 24;

      offCtx.clearRect(0, 0, VIRTUAL_SIZE, VIRTUAL_SIZE);
      offCtx.save();
      offCtx.beginPath();
      offCtx.arc(cx, cy, r, 0, 2 * Math.PI);
      offCtx.fillStyle = '#0a0e17';
      offCtx.fill();
      offCtx.restore();

      for (let i = 0; i < TOTAL_NUMBERS; i++) {
        const start = i * sliceAngle;
        const end = (i + 1) * sliceAngle;
        const mid = start + sliceAngle / 2;

        offCtx.save();
        offCtx.beginPath();
        offCtx.moveTo(cx, cy);
        offCtx.arc(cx, cy, r, start, end);
        offCtx.closePath();
        offCtx.fillStyle = (i % 2 === 0) ? '#0f172a' : '#161f33';
        offCtx.fill();

        offCtx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
        offCtx.lineWidth = 1;
        offCtx.stroke();

        offCtx.beginPath();
        offCtx.arc(cx, cy, r, start, end);
        offCtx.strokeStyle = (i % 4 === 0) ? 'rgba(0, 242, 254, 0.7)' : (i % 4 === 2) ? 'rgba(255, 0, 127, 0.7)' : 'rgba(255, 255, 255, 0.15)';
        offCtx.lineWidth = 3.5;
        offCtx.stroke();

        const pegAngle = start;
        const px = cx + (r - 8) * Math.cos(pegAngle);
        const py = cy + (r - 8) * Math.sin(pegAngle);
        offCtx.beginPath();
        offCtx.arc(px, py, 2.5, 0, 2 * Math.PI);
        offCtx.fillStyle = (i % 2 === 0) ? '#00f2fe' : '#ff007f';
        offCtx.fill();

        offCtx.save();
        offCtx.translate(cx, cy);
        offCtx.rotate(mid);
        offCtx.translate(r - 32, 0);
        offCtx.rotate(Math.PI / 2);
        offCtx.textAlign = 'center';
        offCtx.textBaseline = 'middle';
        const label = items[i];
        offCtx.font = label.length >= 3 ? 'bold 9.5px "Space Grotesk", sans-serif' : 'bold 11px "Space Grotesk", sans-serif';
        offCtx.fillStyle = (i % 2 === 0) ? '#f8fafc' : '#cbd5e1';
        offCtx.fillText(label, 0, 0);
        offCtx.restore();

        offCtx.restore();
      }

      offCtx.save();
      offCtx.beginPath();
      offCtx.arc(cx, cy, r + 5, 0, 2 * Math.PI);
      offCtx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
      offCtx.lineWidth = 3;
      offCtx.stroke();
      offCtx.restore();
    }

    function draw(angle) {
      if (!offscreenCanvas) return;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.rotate(angle);
      ctx.drawImage(offscreenCanvas, -w / 2, -h / 2, w, h);
      ctx.restore();
    }

    function getNumAtPointer(rot) {
      let wa = (-Math.PI / 2 - rot) % (2 * Math.PI);
      if (wa < 0) wa += 2 * Math.PI;
      const idx = Math.floor(wa / sliceAngle) % TOTAL_NUMBERS;
      return { index: idx, label: items[idx] };
    }

    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

    function triggerTickAnim() {
      pointerNeedle.classList.add('tick');
      setTimeout(() => pointerNeedle.classList.remove('tick'), 45);
    }

    function updateStepPills(turn) {
      currentTurn = turn;
      const nextTurn = (turn % 4) + 1;
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`step${i}`);
        if (el) el.classList.toggle('active', i === nextTurn);
      }
      if (!isSpinning) {
        if (nextTurn === 1) spectatorStatus.textContent = 'LISTO: VUELTA 1 DE PRUEBA';
        else if (nextTurn === 2) spectatorStatus.textContent = 'LISTO: VUELTA 2 DE PRUEBA';
        else if (nextTurn === 3) spectatorStatus.textContent = 'LISTO: VUELTA 3 DE PRUEBA';
        else if (nextTurn === 4) spectatorStatus.textContent = 'LISTO: VUELTA 4 (OFICIAL: 51)';
      }
    }

    function executeSpin(targetIndex, targetLabel, isWinner, turn) {
      if (isSpinning) return;
      initAudio();
      isSpinning = true;

      wheelContainer.classList.add('spinning');
      spectatorStatusContainer.classList.add('spinning');
      spectatorStatus.textContent = 'RULETA EN MOVIMIENTO...';
      tapHint.textContent = '⏳ GIRANDO EN TODAS LAS PANTALLAS...';

      const targetSlice = (targetIndex + 0.5) * sliceAngle;
      const pointer = -Math.PI / 2;
      const desired = ((pointer - targetSlice) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const curr = (currentRotation % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      let delta = desired - curr;
      if (delta <= 0) delta += 2 * Math.PI;

      const totalDist = (FULL_ROTATIONS * 2 * Math.PI) + delta;
      const startRot = currentRotation;
      const endRot = startRot + totalDist;
      const startTime = performance.now();

      function step(now) {
        const el = now - startTime;
        const p = Math.min(el / SPIN_DURATION_MS, 1);
        const ep = easeOutQuart(p);
        currentRotation = startRot + totalDist * ep;
        draw(currentRotation);

        const curItem = getNumAtPointer(currentRotation);
        hudValue.textContent = curItem.label;

        if (curItem.index !== lastTickIndex) {
          lastTickIndex = curItem.index;
          playTick();
          triggerTickAnim();
        }

        if (p < 1) {
          requestAnimationFrame(step);
        } else {
          currentRotation = endRot;
          draw(currentRotation);
          const finalItem = getNumAtPointer(currentRotation);
          hudValue.textContent = finalItem.label;

          wheelContainer.classList.remove('spinning');
          spectatorStatusContainer.classList.remove('spinning');
          isSpinning = false;
          playChime();

          if (isWinner) {
            spectatorStatus.textContent = `VUELTA OFICIAL: ${targetLabel}`;
          } else {
            spectatorStatus.textContent = `VUELTA DE PRUEBA: ${targetLabel}`;
          }

          tapHint.textContent = '👆 TOCA LA RULETA PARA EL SIGUIENTE GIRO';
          updateStepPills(turn);
        }
      }
      requestAnimationFrame(step);
    }

    // Conexión SSE con el servidor
    const evtSource = new EventSource('/events');
    evtSource.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'init') {
          updateStepPills(data.spinCount);
        } else if (data.type === 'spin') {
          executeSpin(data.targetIndex, data.targetLabel, data.isWinner, data.turn);
        } else if (data.type === 'reset') {
          updateStepPills(0);
          spectatorStatus.textContent = 'LISTO: VUELTA 1 DE PRUEBA';
        }
      } catch (err) {}
    };

    // AL TOCAR LA RULETA EN MODO ADMINISTRADOR:
    // Se envía la orden al servidor y gira instantáneamente en todas las pantallas
    async function triggerSpinFromAdmin() {
      if (isSpinning) return;
      initAudio();

      try {
        const res = await fetch('/api/spin', { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error || 'Error al iniciar giro');
        }
      } catch (e) {
        alert('No se pudo conectar con el servidor');
      }
    }

    adminWheelTouchable.addEventListener('click', triggerSpinFromAdmin);
    adminWheelTouchable.addEventListener('touchstart', (e) => {
      // Optimización táctil para móvil
      initAudio();
    }, { passive: true });

    // También responde a la tecla Enter si estás en PC
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        triggerSpinFromAdmin();
      }
    });

    // Reiniciar
    resetCycleBtn.addEventListener('click', async () => {
      if (confirm('¿Reiniciar a la Vuelta 1?')) {
        await fetch('/api/reset', { method: 'POST' });
      }
    });

    renderWheel();
    draw(0);
    hudValue.textContent = getNumAtPointer(0).label;
    updateStepPills(0);
  </script>
</body>
</html>
