<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Control Exclusivo | Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #101624;
      --cyan: #00f2fe;
      --magenta: #ff007f;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    .badge-admin {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.4);
      color: var(--magenta);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      padding: 0.4rem 1.1rem;
      border-radius: 100px;
      margin-bottom: 0.8rem;
    }

    .badge-admin .dot {
      width: 8px;
      height: 8px;
      background: var(--magenta);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--magenta);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .title span {
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .spectator-counter {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .spectator-counter strong {
      color: var(--cyan);
      font-family: 'Space Grotesk', monospace;
      font-size: 1rem;
    }

    /* Tarjeta de Control */
    .control-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .turn-indicator-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      padding: 1.2rem;
      border: 1px solid rgba(0, 242, 254, 0.2);
    }

    .turn-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .turn-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--cyan);
      transition: all 0.3s;
    }

    .turn-name.winner-ready {
      color: var(--magenta);
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }

    .turn-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* Botón Gigante de Giro */
    .btn-spin-remote {
      width: 100%;
      padding: 1.4rem;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .btn-spin-remote:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(255, 0, 127, 0.4);
    }

    .btn-spin-remote:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-spin-remote:disabled {
      background: #1e293b;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-spin-remote.winner-spin {
      background: linear-gradient(135deg, #ff007f, #b00057);
      box-shadow: 0 10px 35px rgba(255, 0, 127, 0.5);
      animation: pulseBtn 1.8s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.02); filter: brightness(1.2); }
    }

    /* Historial breve */
    .last-result-box {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.4rem;
    }

    .last-result-box strong {
      color: #ffffff;
      font-family: 'Space Grotesk', monospace;
      font-size: 1.1rem;
    }

    /* Botones secundarios */
    .footer-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      max-width: 440px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      padding: 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-admin">
      <span class="dot"></span> CONTROL REMOTO DE TRANSMISIÓN
    </div>
    <h1 class="title">PANEL DE <span>CONTROL</span></h1>
    <div class="spectator-counter">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Móviles y pantallas conectadas: <strong id="spectatorCount">1</strong></span>
    </div>
  </div>

  <div class="control-card">
    <div class="turn-indicator-box">
      <div class="turn-label">ESTADO DEL CICLO</div>
      <div class="turn-name" id="turnName">VUELTA 1 DE PRUEBA</div>
      <div class="turn-sub" id="turnSub">Número aleatorio (excluye el 51)</div>
    </div>

    <button id="spinBtnRemote" class="btn-spin-remote" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span id="btnText">GIRAR RULETA</span>
    </button>

    <div class="last-result-box" id="lastResultBox">
      Último resultado: <span id="lastResultText">Ninguno aún</span>
    </div>
  </div>

  <div class="footer-actions">
    <button id="resetCycleBtn" class="btn-secondary" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Reiniciar Ciclo a Vuelta 1
    </button>
    <a href="/index.html" target="_blank" class="btn-secondary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      Abrir Vista de Espectador (Ruleta)
    </a>
  </div>

  <script>
    const turnName = document.getElementById('turnName');
    const turnSub = document.getElementById('turnSub');
    const spinBtnRemote = document.getElementById('spinBtnRemote');
    const btnText = document.getElementById('btnText');
    const spectatorCount = document.getElementById('spectatorCount');
    const lastResultText = document.getElementById('lastResultText');
    const resetCycleBtn = document.getElementById('resetCycleBtn');

    let currentTurn = 0;
    let isSpinning = false;

    function updateTurnUI(turn) {
      currentTurn = turn;
      const nextTurn = turn + 1;

      if (nextTurn === 1) {
        turnName.textContent = 'VUELTA 1 DE PRUEBA';
        turnName.classList.remove('winner-ready');
        turnSub.textContent = 'Número aleatorio (excluye el 51)';
        btnText.textContent = 'GIRAR VUELTA 1';
        spinBtnRemote.classList.remove('winner-spin');
      } else if (nextTurn === 2) {
        turnName.textContent = 'VUELTA 2 DE PRUEBA';
        turnName.classList.remove('winner-ready');
        turnSub.textContent = 'Número aleatorio (excluye el 51)';
        btnText.textContent = 'GIRAR VUELTA 2';
        spinBtnRemote.classList.remove('winner-spin');
      } else if (nextTurn === 3) {
        turnName.textContent = 'VUELTA 3 DE PRUEBA';
        turnName.classList.remove('winner-ready');
        turnSub.textContent = 'Número aleatorio (excluye el 51)';
        btnText.textContent = 'GIRAR VUELTA 3';
        spinBtnRemote.classList.remove('winner-spin');
      } else if (nextTurn === 4) {
        turnName.textContent = 'VUELTA 4 (OFICIAL)';
        turnName.classList.add('winner-ready');
        turnSub.textContent = 'Cae en el número 51 con confeti';
        btnText.textContent = 'GIRAR VUELTA 4 (51)';
        spinBtnRemote.classList.add('winner-spin');
      } else {
        turnName.textContent = `VUELTA #${nextTurn} (LIBRE)`;
        turnName.classList.remove('winner-ready');
        turnSub.textContent = 'Ciclo principal completado';
        btnText.textContent = 'GIRAR RULETA';
        spinBtnRemote.classList.remove('winner-spin');
      }
    }

    // Conectar a eventos en tiempo real
    const evtSource = new EventSource('/events');

    evtSource.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'init') {
          updateTurnUI(data.spinCount);
          if (data.spectatorCount) spectatorCount.textContent = data.spectatorCount;
        } else if (data.type === 'spectator_count') {
          spectatorCount.textContent = data.count;
        } else if (data.type === 'spin') {
          isSpinning = true;
          spinBtnRemote.disabled = true;
          btnText.textContent = 'RULETA EN MOVIMIENTO...';

          setTimeout(() => {
            isSpinning = false;
            spinBtnRemote.disabled = false;
            updateTurnUI(data.turn);
            lastResultText.innerHTML = `<strong>${data.targetLabel}</strong> (${data.isWinner ? 'Oficial' : 'Prueba'})`;
          }, 4200);
        } else if (data.type === 'reset') {
          updateTurnUI(0);
          lastResultText.textContent = 'Ciclo reiniciado';
        }
      } catch (err) {}
    };

    // Al presionar el botón de giro
    spinBtnRemote.addEventListener('click', async () => {
      if (isSpinning) return;
      spinBtnRemote.disabled = true;
      btnText.textContent = 'ENVIANDO ORDEN...';

      try {
        const res = await fetch('/api/spin', { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error || 'Error al girar');
          spinBtnRemote.disabled = false;
          updateTurnUI(currentTurn);
        }
      } catch (err) {
        alert('No se pudo conectar con el servidor');
        spinBtnRemote.disabled = false;
        updateTurnUI(currentTurn);
      }
    });

    // Reiniciar ciclo
    resetCycleBtn.addEventListener('click', async () => {
      if (confirm('¿Deseas reiniciar el ciclo a la Vuelta 1?')) {
        await fetch('/api/reset', { method: 'POST' });
      }
    });

    updateTurnUI(0);
  </script>
</body>
</html>
