<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta Oficial | Sorteo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Vista ultra-limpia sin nada arriba ni abajo: Solo la ruleta gigante centrada */
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary);
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .roulette-section {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wheel-outer-wrapper {
      width: min(94vw, 75dvh, 640px) !important;
      height: min(94vw, 75dvh, 640px) !important;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="spectator-view">
  <!-- Efectos de iluminación ambiental neón -->
  <div class="bg-glow bg-glow-cyan"></div>
  <div class="bg-glow bg-glow-magenta"></div>
  <div class="grid-overlay"></div>

  <div class="app-container">
    <main class="roulette-section">
      <!-- Ruleta Gigante en el Centro Visual (Solo Vista para Espectadores) -->
      <div class="wheel-outer-wrapper" id="wheelOuterWrapper">
        <!-- Aguja física indicadora superior -->
        <div class="pointer-assembly" id="pointerAssembly">
          <div class="pointer-glow"></div>
          <div class="pointer-pin"></div>
          <div class="pointer-needle" id="pointerNeedle"></div>
        </div>

        <!-- Canvas de la Ruleta -->
        <div class="wheel-canvas-container" id="wheelContainer">
          <canvas id="rouletteCanvas" width="1000" height="1000"></canvas>
          
          <!-- Núcleo central decorativo -->
          <div class="wheel-center-hub">
            <div class="hub-ring"></div>
            <div class="hub-core">
              <svg class="hub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
